<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Геоцентрическая система с Луной и Зодиаком</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #030712;
            color: #f3f4f6;
            font-family: system-ui, -apple-system, sans-serif;
        }
        canvas {
            touch-action: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4">

    <!-- Header -->
    <header class="w-full max-w-5xl flex flex-col md:flex-row items-center justify-between py-3 px-6 bg-gray-900/80 backdrop-blur-md rounded-2xl border border-gray-800 shadow-xl mb-4">
        <div class="flex items-center space-x-3 mb-2 md:mb-0">
            <div class="w-10 h-10 rounded-xl bg-amber-500/20 border border-amber-500/40 flex items-center justify-center text-amber-400 text-xl shadow-lg shadow-amber-500/10">
                <i class="fa-solid fa-moon"></i>
            </div>
            <div>
                <h1 class="text-lg font-bold tracking-wide">Геоцентрическая модель</h1>
                <p class="text-xs text-gray-400">Наблюдатель в центре, Солнце и Луна на орбитах</p>
            </div>
        </div>

        <!-- Info / Current Date Display -->
        <div class="flex items-center space-x-4 bg-gray-950/60 px-4 py-2 rounded-xl border border-gray-800/80 text-sm">
            <div>
                <span class="text-gray-400 text-xs block">Дата:</span>
                <span id="dateDisplay" class="font-semibold text-amber-300">--.--.----</span>
            </div>
            <div class="border-l border-gray-800 pl-4">
                <span class="text-gray-400 text-xs block">Знак Солнца:</span>
                <span id="zodiacDisplay" class="font-semibold text-indigo-300">--</span>
            </div>
        </div>
    </header>

    <!-- Main Canvas Container -->
    <main class="w-full max-w-5xl flex-grow flex items-center justify-center relative bg-gray-950/50 rounded-3xl border border-gray-800/60 overflow-hidden shadow-2xl min-h-[500px]">
        <canvas id="spaceCanvas" class="w-full h-full absolute inset-0 cursor-grab active:cursor-grabbing"></canvas>
        
        <!-- Floating controls overlay -->
        <div class="absolute bottom-4 left-4 right-4 md:left-auto md:right-4 md:w-80 bg-gray-900/90 backdrop-blur-md p-4 rounded-2xl border border-gray-800 shadow-2xl flex flex-col space-y-3">
            <div class="flex items-center justify-between">
                <span class="text-xs font-semibold text-gray-300 uppercase tracking-wider">Управление симуляцией</span>
                <button id="todayBtn" class="text-xs bg-indigo-600 hover:bg-indigo-500 text-white px-2.5 py-1 rounded-lg transition font-medium shadow-sm">
                    Сегодня
                </button>
            </div>

            <!-- Date Picker -->
            <div class="flex flex-col space-y-1">
                <label for="datePicker" class="text-xs text-gray-400">Выбрать дату:</label>
                <input type="date" id="datePicker" class="bg-gray-950 border border-gray-800 rounded-xl px-3 py-1.5 text-sm text-gray-200 focus:outline-none focus:border-indigo-500">
            </div>

            <!-- Play / Pause & Speed -->
            <div class="flex items-center space-x-2 pt-1">
                <button id="playPauseBtn" class="flex-1 bg-amber-500 hover:bg-amber-400 text-gray-950 font-bold py-2 px-3 rounded-xl transition flex items-center justify-center space-x-2 shadow-lg shadow-amber-500/20">
                    <i id="playPauseIcon" class="fa-solid fa-pause"></i>
                    <span id="playPauseText" class="text-xs">Пауза</span>
                </button>
                <button id="resetViewBtn" class="bg-gray-800 hover:bg-gray-700 text-gray-300 py-2 px-3 rounded-xl transition text-xs font-medium" title="Центрировать">
                    <i class="fa-solid fa-arrows-to-dot"></i>
                </button>
            </div>

            <!-- Speed Slider -->
            <div class="flex flex-col space-y-1">
                <div class="flex justify-between text-xs text-gray-400">
                    <span>Скорость:</span>
                    <span id="speedVal" class="text-amber-400 font-mono">5.0x</span>
                </div>
                <input type="range" id="speedRange" min="0.1" max="50" step="0.5" value="5" class="accent-amber-500 cursor-pointer">
            </div>

            <!-- Options Checkboxes -->
            <div class="grid grid-cols-2 gap-2 pt-1 text-xs text-gray-300 border-t border-gray-800/80 pt-3">
                <label class="flex items-center space-x-2 cursor-pointer">
                    <input type="checkbox" id="showOrbits" checked class="accent-indigo-500 rounded">
                    <span>Орбиты</span>
                </label>
                <label class="flex items-center space-x-2 cursor-pointer">
                    <input type="checkbox" id="showRays" checked class="accent-indigo-500 rounded">
                    <span>Лучи / Проекция</span>
                </label>
            </div>
        </div>
    </main>

    <!-- Footer help text -->
    <footer class="w-full max-w-5xl text-center py-3 text-xs text-gray-500">
        Масштабирование колесиком • Перемещение зажатой кнопкой • Знак Овна (♈) зафиксирован справа.
    </footer>

    <script>
        const canvas = document.getElementById('spaceCanvas');
        const ctx = canvas.getContext('2d');

        const playPauseBtn = document.getElementById('playPauseBtn');
        const playPauseIcon = document.getElementById('playPauseIcon');
        const playPauseText = document.getElementById('playPauseText');
        const speedRange = document.getElementById('speedRange');
        const speedVal = document.getElementById('speedVal');
        const showOrbitsCheck = document.getElementById('showOrbits');
        const showRaysCheck = document.getElementById('showRays');
        const datePicker = document.getElementById('datePicker');
        const todayBtn = document.getElementById('todayBtn');
        const resetViewBtn = document.getElementById('resetViewBtn');
        const dateDisplay = document.getElementById('dateDisplay');
        const zodiacDisplay = document.getElementById('zodiacDisplay');

        // Zodiac signs (12 signs, Aries (♈) at 0 degrees / Right)
        const zodiacSigns = [
            { name: "Овен", symbol: "♈" },
            { name: "Телец", symbol: "♉" },
            { name: "Близнецы", symbol: "♊" },
            { name: "Рак", symbol: "♋" },
            { name: "Лев", symbol: "♌" },
            { name: "Дева", symbol: "♍" },
            { name: "Весы", symbol: "♎" },
            { name: "Скорпион", symbol: "♏" },
            { name: "Стрелец", symbol: "♐" },
            { name: "Козерог", symbol: "♑" },
            { name: "Водолей", symbol: "♒" },
            { name: "Рыбы", symbol: "♓" }
        ];

        let isPlaying = true;
        let timeSpeed = 5.0;
        let scale = 1.0;
        let panX = 0;
        let panY = 0;
        let isDragging = false;
        let startX, startY;

        let currentDate = new Date();

        function formatDateToInput(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        datePicker.value = formatDateToInput(currentDate);

        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function getSunAngle(date) {
            const year = date.getFullYear();
            const vernalEquinox = new Date(year, 2, 21); // 21 марта - весеннее равноденствие (Овен)
            const diffDays = (date - vernalEquinox) / (1000 * 60 * 60 * 24);
            const angle = (diffDays / 365.2425) * 2 * Math.PI;
            return angle;
        }

        function getZodiacSign(angle) {
            let deg = (angle * (180 / Math.PI)) % 360;
            if (deg < 0) deg += 360;
            const index = Math.floor(deg / 30) % 12;
            return zodiacSigns[index];
        }

        // Mouse & Touch interactions
        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX - panX;
            startY = e.clientY - panY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            panX = e.clientX - startX;
            panY = e.clientY - startY;
        });

        window.addEventListener('mouseup', () => { isDragging = false; });

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomIntensity = 0.1;
            if (e.deltaY < 0) {
                scale *= (1 + zoomIntensity);
            } else {
                scale /= (1 + zoomIntensity);
            }
            scale = Math.max(0.4, Math.min(3.0, scale));
        }, { passive: false });

        canvas.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                isDragging = true;
                startX = e.touches[0].clientX - panX;
                startY = e.touches[0].clientY - panY;
            }
        });
        window.addEventListener('touchmove', (e) => {
            if (!isDragging || e.touches.length !== 1) return;
            panX = e.touches[0].clientX - startX;
            panY = e.touches[0].clientY - startY;
        });
        window.addEventListener('touchend', () => { isDragging = false; });

        playPauseBtn.addEventListener('click', () => {
            isPlaying = !isPlaying;
            if (isPlaying) {
                playPauseIcon.className = "fa-solid fa-pause";
                playPauseText.textContent = "Пауза";
            } else {
                playPauseIcon.className = "fa-solid fa-play";
                playPauseText.textContent = "Старт";
            }
        });

        speedRange.addEventListener('input', (e) => {
            timeSpeed = parseFloat(e.target.value);
            speedVal.textContent = timeSpeed.toFixed(1) + 'x';
        });

        datePicker.addEventListener('change', (e) => {
            if (e.target.value) {
                currentDate = new Date(e.target.value);
            }
        });

        todayBtn.addEventListener('click', () => {
            currentDate = new Date();
            datePicker.value = formatDateToInput(currentDate);
        });

        resetViewBtn.addEventListener('click', () => {
            scale = 1.0;
            panX = 0;
            panY = 0;
        });

        let lastTimestamp = performance.now();

        function animate(timestamp) {
            const dt = (timestamp - lastTimestamp) / 1000;
            lastTimestamp = timestamp;

            if (isPlaying) {
                const daysToAdd = dt * timeSpeed * 3; // Ускоренный шаг для плавности
                currentDate.setDate(currentDate.getDate() + daysToAdd);
                datePicker.value = formatDateToInput(currentDate);
            }

            const options = { day: 'numeric', month: 'long', year: 'numeric' };
            dateDisplay.textContent = currentDate.toLocaleDateString('ru-RU', options);

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const centerX = canvas.width / 2 + panX;
            const centerY = canvas.height / 2 + panY;
            const minDim = Math.min(canvas.width, canvas.height);
            const baseRadius = minDim * 0.35 * scale;

            const sunOrbitRadius = baseRadius * 0.75;
            const moonOrbitRadius = baseRadius * 0.33;
            const zodiacRadius = baseRadius * 1.05;

            // Zodiac Circle
            if (showOrbitsCheck.checked) {
                ctx.beginPath();
                ctx.arc(centerX, centerY, zodiacRadius, 0, 2 * Math.PI);
                ctx.strokeStyle = 'rgba(99, 102, 241, 0.25)';
                ctx.lineWidth = 1.5;
                ctx.setLineDash([4, 4]);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            // Zodiac Signs
            for (let i = 0; i < 12; i++) {
                const angle = (i * 30) * (Math.PI / 180);
                const x = centerX + zodiacRadius * Math.cos(angle);
                const y = centerY + zodiacRadius * Math.sin(angle);

                ctx.beginPath();
                ctx.moveTo(centerX + (zodiacRadius - 8) * Math.cos(angle), centerY + (zodiacRadius - 8) * Math.sin(angle));
                ctx.lineTo(centerX + (zodiacRadius + 8) * Math.cos(angle), centerY + (zodiacRadius + 8) * Math.sin(angle));
                ctx.strokeStyle = 'rgba(129, 140, 248, 0.5)';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                ctx.save();
                ctx.translate(x, y);
                ctx.font = `${Math.max(16, 20 * scale)}px Arial, sans-serif`;
                ctx.fillStyle = i === 0 ? '#f59e0b' : '#9ca3af';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(zodiacSigns[i].symbol, 0, 0);
                ctx.restore();
            }

            // Moon Orbit
            if (showOrbitsCheck.checked) {
                ctx.beginPath();
                ctx.arc(centerX, centerY, moonOrbitRadius, 0, 2 * Math.PI);
                ctx.strokeStyle = 'rgba(156, 163, 175, 0.2)';
                ctx.lineWidth = 1;
                ctx.stroke();
            }

            // Sun Orbit
            if (showOrbitsCheck.checked) {
                ctx.beginPath();
                ctx.arc(centerX, centerY, sunOrbitRadius, 0, 2 * Math.PI);
                ctx.strokeStyle = 'rgba(245, 158, 11, 0.3)';
                ctx.lineWidth = 1.5;
                ctx.stroke();
            }

            const sunAngle = getSunAngle(currentDate);
            const sunX = centerX + sunOrbitRadius * Math.cos(sunAngle);
            const sunY = centerY + sunOrbitRadius * Math.sin(sunAngle);

            const currentZodiac = getZodiacSign(sunAngle);
            zodiacDisplay.textContent = `${currentZodiac.symbol} ${currentZodiac.name}`;

            const yearStart = new Date(currentDate.getFullYear(), 0, 1);
            const daysPassed = (currentDate - yearStart) / (1000 * 60 * 60 * 24);
            const moonAngle = (daysPassed / 27.32) * 2 * Math.PI;
            const moonX = centerX + moonOrbitRadius * Math.cos(moonAngle);
            const moonY = centerY + moonOrbitRadius * Math.sin(moonAngle);

            // Bright Sun Rays / Projection
            if (showRaysCheck.checked) {
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                const projX = centerX + (zodiacRadius + 25) * Math.cos(sunAngle);
                const projY = centerY + (zodiacRadius + 25) * Math.sin(sunAngle);
                ctx.lineTo(projX, projY);
                ctx.strokeStyle = 'rgba(251, 191, 36, 0.85)';
                ctx.lineWidth = 2.5;
                ctx.setLineDash([6, 4]);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            // Central Observer
            ctx.beginPath();
            ctx.arc(centerX, centerY, 6, 0, 2 * Math.PI);
            ctx.fillStyle = '#60a5fa';
            ctx.shadowColor = '#3b82f6';
            ctx.shadowBlur = 12;
            ctx.fill();
            ctx.shadowBlur = 0;

            ctx.font = '11px sans-serif';
            ctx.fillStyle = '#93c5fd';
            ctx.textAlign = 'center';
            ctx.fillText("Наблюдатель", centerX, centerY + 20);

            // Moon
            ctx.beginPath();
            ctx.arc(moonX, moonY, 7 * Math.max(0.7, scale * 0.8), 0, 2 * Math.PI);
            ctx.fillStyle = '#d1d5db';
            ctx.shadowColor = '#9ca3af';
            ctx.shadowBlur = 8;
            ctx.fill();
            ctx.shadowBlur = 0;

            ctx.font = '10px sans-serif';
            ctx.fillStyle = '#9ca3af';
            ctx.textAlign = 'center';
            ctx.fillText("Луна", moonX, moonY - 14);

            // Sun
            const sunRadius = 14 * Math.max(0.7, scale * 0.8);
            const gradient = ctx.createRadialGradient(sunX, sunY, 2, sunX, sunY, sunRadius * 2.5);
            gradient.addColorStop(0, 'rgba(251, 191, 36, 1)');
            gradient.addColorStop(0.5, 'rgba(245, 158, 11, 0.5)');
            gradient.addColorStop(1, 'rgba(245, 158, 11, 0)');

            ctx.beginPath();
            ctx.arc(sunX, sunY, sunRadius * 2.5, 0, 2 * Math.PI);
            ctx.fillStyle = gradient;
            ctx.fill();

            ctx.beginPath();
            ctx.arc(sunX, sunY, sunRadius, 0, 2 * Math.PI);
            ctx.fillStyle = '#fbbf24';
            ctx.shadowColor = '#f59e0b';
            ctx.shadowBlur = 25;
            ctx.fill();
            ctx.shadowBlur = 0;

            ctx.font = '12px sans-serif';
            ctx.fillStyle = '#fde68a';
            ctx.textAlign = 'center';
            ctx.fillText("Солнце", sunX, sunY - sunRadius - 8);

            requestAnimationFrame(animate);
        }

        requestAnimationFrame(animate);
    </script>
</body>
</html>
